# Verify the committed outputs of the repository's generation chain.
#
# The generated export lists, the feature blocks and the committed metadata are
# build inputs, so every generator runs in --check mode (regenerate into a
# scratch copy, compare byte for byte) on all three host platforms. The AST
# comes from clang++ itself (-ast-dump=json): the generator needs only the
# compiler driver pinned in .xlings.json (`llvm`), installed by xlings like the
# build toolchains, plus the MinGW sysroot under tools/_deps provisioned by
# fetch_mingw_sysroot.py. No libclang, no LLVM release archive.
#
# The generator cache under target/gen/exports-cache (bundle TUs, pruned-GMF
# verdicts and incremental-skip keys) is worth caching because a hit skips the
# AST dump of an unchanged library entirely.
name: Verify Generation Scripts

env:
  XLINGS_VERSION: v2026.10.26.1
  XLINGS_NON_INTERACTIVE: '1'

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-scripts.yml"
      - "tools/**"
      - "src/**"
      - "patches/**"
      - "generated/**"
      - "upstream/boost/**"
      - "port/**"
      - "mcpp.toml"
      - ".gitignore"
      - ".gitattributes"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-scripts.yml"
      - "tools/**"
      - "src/**"
      - "patches/**"
      - "generated/**"
      - "upstream/boost/**"
      - "port/**"
      - "mcpp.toml"
      - ".gitignore"
      - ".gitattributes"

concurrency:
  group: generated-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    env:
      GITHUB_EVENT_BEFORE: ${{ github.event.before }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # import_boost is platform-independent and intentionally owned by one
          # leg, so an update does not trigger three large downloads.
          - os: ubuntu-latest
            check_import_boost: true
          - os: windows-latest
            check_import_boost: false
          - os: macos-latest
            check_import_boost: false

    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock

      - name: Install xlings
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors \
            https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh \
            | bash -s "$XLINGS_VERSION"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      - name: Install xlings
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.ps1 | iex
          "$env:USERPROFILE\.xlings\subos\current\bin" |
            Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      # .xlings.json pins the generator's clang++ next to mcpp. The xlings
      # package installs a host config file for native builds; the generator
      # parses for an explicit MinGW target and sysroot, so it is ignored.
      - name: Install project tools (.xlings.json -> mcpp, llvm)
        shell: bash
        run: |
          set -euo pipefail
          xlings update
          xlings install -y
          echo "CLANG_NO_DEFAULT_CONFIG=1" >> "$GITHUB_ENV"
          LLVM_VERSION="$(python -c "import json; print(json.load(open('.xlings.json'))['workspace']['llvm'])")"
          echo "LLVM_VERSION=$LLVM_VERSION" >> "$GITHUB_ENV"
          clang++ --version

      - name: Cache MinGW sysroot archive
        uses: actions/cache@v6
        with:
          path: tools/_deps/_archives
          key: mingw-sysroot-archive-${{ runner.os }}-${{ hashFiles('tools/fetch_mingw_sysroot.py') }}
          restore-keys: |
            mingw-sysroot-archive-${{ runner.os }}-

      # gen_exports.py caches bundle TUs, pruned-GMF verdicts and
      # incremental-skip keys under target/gen/exports-cache. Every entry is
      # self-validating (keyed on the content hash of the closure it describes
      # plus the generator and clang versions), so restoring an older
      # commit's cache yields misses rather than wrong output. The salt in the
      # key only bounds rollover: a generator or sysroot-pin change drops the
      # restore prefix instead of mixing verdicts across engine changes.
      - name: Cache generator export intermediates
        uses: actions/cache@v6
        with:
          path: target/gen/exports-cache
          key: exports-cache-v2-${{ runner.os }}-${{ runner.arch }}-llvm-${{ env.LLVM_VERSION }}-${{ hashFiles('tools/gen_exports.py', 'tools/ast_json.py', 'tools/boost_common.py', 'tools/export_policy.toml', 'tools/fetch_mingw_sysroot.py') }}-${{ github.sha }}
          restore-keys: |
            exports-cache-v2-${{ runner.os }}-${{ runner.arch }}-llvm-${{ env.LLVM_VERSION }}-${{ hashFiles('tools/gen_exports.py', 'tools/ast_json.py', 'tools/boost_common.py', 'tools/export_policy.toml', 'tools/fetch_mingw_sysroot.py') }}-

      - name: Install tool dependencies
        run: uv sync --project tools --locked

      - name: Check the AST compiler and tool regressions
        working-directory: tools
        run: |
          uv run --locked python -c "import ast_json as aj; v = aj.clang_release(); print('AST compiler: clang', v); assert v == '${{ env.LLVM_VERSION }}', v"
          uv run --locked python -m unittest discover -s tests

      - name: Verify generated outputs (including import_boost when changed)
        if: matrix.check_import_boost
        run: uv run --project tools --locked python tools/ci/verify_generated.py --import-boost-if-changed

      - name: Verify generated outputs
        if: ${{ !matrix.check_import_boost }}
        run: uv run --project tools --locked python tools/ci/verify_generated.py

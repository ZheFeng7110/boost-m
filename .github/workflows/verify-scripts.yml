# Verify the committed outputs of the repository's generation chain.
#
# The generated export lists, the feature blocks and the committed metadata are
# build inputs, so every generator runs in --check mode (regenerate into a
# scratch copy, compare byte for byte) on all three host platforms. The AST
# comes from clang++ itself (-ast-dump=json): the generator needs only the
# compiler driver pinned in .xlings.json (`llvm`), installed by xlings like the
# build toolchains, plus the MinGW sysroot under tools/_deps provisioned by
# fetch_mingw_sysroot.py. No libclang, no LLVM release archive.
#
# The generator cache under target/gen/exports-cache (bundle TUs, pruned-GMF
# verdicts and incremental-skip keys) is worth caching because a hit skips the
# AST dump of an unchanged library entirely.
#
# Nightly (and on demand), the cache-drift job proves that cache sound: it
# regenerates once with the restored CI cache and once from an empty cache and
# compares both with the committed files (tools/ci/check_cache_drift.py). On
# drift the job fails, uploads the evidence, saves the cold cache over the
# stale one, and the report job opens or updates the `cache-drift` issue.
name: Verify Generation Scripts

env:
  XLINGS_VERSION: v2026.10.26.1
  XLINGS_NON_INTERACTIVE: '1'

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-scripts.yml"
      - ".github/actions/setup-generator/**"
      - "tools/**"
      - "src/**"
      - "patches/**"
      - "generated/**"
      - "upstream/boost/**"
      - "port/**"
      - "mcpp.toml"
      - ".gitignore"
      - ".gitattributes"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-scripts.yml"
      - ".github/actions/setup-generator/**"
      - "tools/**"
      - "src/**"
      - "patches/**"
      - "generated/**"
      - "upstream/boost/**"
      - "port/**"
      - "mcpp.toml"
      - ".gitignore"
      - ".gitattributes"

# The event is part of the group: a push to main must not cancel the nightly
# run on main (or the reverse).
concurrency:
  group: generated-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }}
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    env:
      GITHUB_EVENT_BEFORE: ${{ github.event.before }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # import_boost is platform-independent and intentionally owned by one
          # leg, so an update does not trigger three large downloads.
          - os: ubuntu-latest
            check_import_boost: true
          - os: windows-latest
            check_import_boost: false
          - os: macos-latest
            check_import_boost: false

    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up the generation toolchain
        uses: ./.github/actions/setup-generator

      # gen_exports.py caches bundle TUs, pruned-GMF verdicts and
      # incremental-skip keys under target/gen/exports-cache. Every entry is
      # self-validating (keyed on the generator, clang and flags, and valid
      # only while every file clang read for it and the first-wins ownership
      # it was computed under still hold), so restoring an older commit's
      # cache yields misses rather than wrong output; the nightly cache-drift
      # job checks exactly that. The salt in the key only bounds rollover: a
      # generator or sysroot-pin change drops the restore prefix instead of
      # mixing verdicts across engine changes.
      - name: Cache generator export intermediates
        uses: actions/cache@v6
        with:
          path: target/gen/exports-cache
          key: exports-cache-v2-${{ runner.os }}-${{ runner.arch }}-llvm-${{ env.LLVM_VERSION }}-${{ hashFiles('tools/gen_exports.py', 'tools/ast_json.py', 'tools/boost_common.py', 'tools/export_policy.toml', 'tools/fetch_mingw_sysroot.py') }}-${{ github.sha }}
          restore-keys: |
            exports-cache-v2-${{ runner.os }}-${{ runner.arch }}-llvm-${{ env.LLVM_VERSION }}-${{ hashFiles('tools/gen_exports.py', 'tools/ast_json.py', 'tools/boost_common.py', 'tools/export_policy.toml', 'tools/fetch_mingw_sysroot.py') }}-

      - name: Check the AST compiler and tool regressions
        working-directory: tools
        run: |
          uv run --locked python -c "import ast_json as aj; v = aj.clang_release(); print('AST compiler: clang', v); assert v == '${{ env.LLVM_VERSION }}', v"
          uv run --locked python -m unittest discover -s tests

      - name: Verify generated outputs (including import_boost when changed)
        if: matrix.check_import_boost
        run: uv run --project tools --locked python tools/ci/verify_generated.py --import-boost-if-changed

      - name: Verify generated outputs
        if: ${{ !matrix.check_import_boost }}
        run: uv run --project tools --locked python tools/ci/verify_generated.py

  cache-drift:
    name: cache drift (${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the generation toolchain
        uses: ./.github/actions/setup-generator

      # The cache verify restores: the newest entry under the current salt.
      - name: Restore generator export intermediates
        uses: actions/cache/restore@v6
        with:
          path: target/gen/exports-cache
          key: exports-cache-v2-${{ runner.os }}-${{ runner.arch }}-llvm-${{ env.LLVM_VERSION }}-${{ hashFiles('tools/gen_exports.py', 'tools/ast_json.py', 'tools/boost_common.py', 'tools/export_policy.toml', 'tools/fetch_mingw_sysroot.py') }}-${{ github.sha }}
          restore-keys: |
            exports-cache-v2-${{ runner.os }}-${{ runner.arch }}-llvm-${{ env.LLVM_VERSION }}-${{ hashFiles('tools/gen_exports.py', 'tools/ast_json.py', 'tools/boost_common.py', 'tools/export_policy.toml', 'tools/fetch_mingw_sysroot.py') }}-

      - name: Compare cached, cold and committed generation
        id: drift
        run: uv run --project tools --locked python tools/ci/check_cache_drift.py --out target/cache-drift

      # Upload before anything replaces the stale entries: the restored
      # versions are the evidence of what the cache key missed.
      - name: Upload drift evidence
        if: ${{ !cancelled() && steps.drift.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: cache-drift-${{ runner.os }}
          path: target/cache-drift
          if-no-files-found: ignore
          retention-days: 30

      # The cold run rewrote target/gen/exports-cache from scratch. Saved
      # under the restore prefix, it is the newest entry, so the next verify
      # run restores it instead of the stale one.
      - name: Save the cold cache over the stale one
        if: ${{ !cancelled() && steps.drift.outputs.cache_drift == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: target/gen/exports-cache
          key: exports-cache-v2-${{ runner.os }}-${{ runner.arch }}-llvm-${{ env.LLVM_VERSION }}-${{ hashFiles('tools/gen_exports.py', 'tools/ast_json.py', 'tools/boost_common.py', 'tools/export_policy.toml', 'tools/fetch_mingw_sysroot.py') }}-${{ github.sha }}-cold-${{ github.run_id }}

  report:
    name: report cache drift
    needs: cache-drift
    if: ${{ !cancelled() && needs.cache-drift.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: tools

      # Absent when no platform got as far as the comparison.
      - name: Download drift results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: cache-drift-*
          path: drift

      # One open issue tracks drift: later runs comment on it instead of
      # opening duplicates.
      - name: Open or update the cache-drift issue
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p drift
          python3 tools/ci/check_cache_drift.py --summarize drift \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > issue.md
          if [ ! -s issue.md ]; then
            echo "no drift reported"
            exit 0
          fi
          gh label create cache-drift --color B60205 \
            --description "Generator cache replayed output a cold run does not produce" \
            --force
          number="$(gh issue list --label cache-drift --state open \
            --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file issue.md
          else
            gh issue create --title "Generator cache drift detected" \
              --label cache-drift --body-file issue.md
          fi

name: ci-macos

# macOS CI (Apple Silicon) — same flow as ci-linux.yml, on the LLVM toolchain
# mcpp resolves by default on macOS. The runner must be arm64: the mcpp package
# index ships macOS artifacts for aarch64 only. Apple's linker is selected by
# [target.macos.build] (lld-macho drops a zero-unwind entry, see the manifest).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  XLINGS_VERSION: v2026.7.28.4
  XLINGS_NON_INTERACTIVE: '1'
  MCPP_JOBS: '4'

jobs:
  build-test:
    name: build + test (macos arm64 llvm)
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xlings
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh \
            | bash -s "$XLINGS_VERSION"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      - name: Install project tools (.xlings.json → mcpp)
        run: |
          xlings update
          xlings install -y
          mcpp --version

      - name: Build library (default feature closure)
        run: mcpp build

      - name: Run tests
        run: mcpp test

      - name: Run example (umbrella module)
        run: |
          cd examples/basic
          mcpp run

      - name: Render, build and run the default template
        run: python3 tools/test_template.py

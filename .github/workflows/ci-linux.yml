name: ci-linux

# Linux CI — the path a user walks after installing the tool:
#   xlings install (project env, pinned by .xlings.json) → build → test →
#   example → template.
#
# Two compiler legs and two architectures: GCC is the default toolchain, LLVM is
# the one whose aggregate limits differ; arm64 is where the x86-only profiles must
# not leak into the base build. Split per OS on purpose (ci-macos.yml /
# ci-windows.yml): one badge and one log per platform.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-linux-${{ github.ref }}-${{ matrix.name }}
  cancel-in-progress: true

env:
  XLINGS_VERSION: v2026.7.28.4
  XLINGS_NON_INTERACTIVE: '1'
  # Leave the runners room: the vendored tree is large and every leg compiles
  # Boost from the same checkout.
  MCPP_JOBS: '4'

jobs:
  build-test:
    name: build + test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux x86_64 gcc
            os: ubuntu-latest
            toolchain: gcc@16.1.0
          - name: linux x86_64 llvm
            os: ubuntu-latest
            toolchain: llvm@22.1.8
          - name: linux arm64 gcc
            os: ubuntu-24.04-arm
            toolchain: gcc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xlings
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh \
            | bash -s "$XLINGS_VERSION"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      - name: Install project tools (.xlings.json → mcpp)
        run: |
          xlings update
          xlings install -y
          mcpp --version

      - name: Build library (default feature closure)
        run: mcpp build --toolchain "${{ matrix.toolchain }}"

      - name: Run tests
        run: mcpp test --toolchain "${{ matrix.toolchain }}"

      - name: Run example (umbrella module)
        run: |
          cd examples/basic
          mcpp run --toolchain "${{ matrix.toolchain }}"

      - name: Render, build and run the default template
        run: python3 tools/test_template.py --toolchain "${{ matrix.toolchain }}"

      - name: Check release coordinate and bilingual entry pages
        run: python3 tools/check_mwrap_release.py

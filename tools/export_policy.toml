[range.facade]
omit-imports = ["regex"]
reason = '''
The regex adaptors reference entities regex owns, but src/range.cppm does not
`export import` regex: gcc 16.1.0 rejects the boost::regex v5 abi-tag surface
inside a module interface (see [algorithm]), so the edge stays out of the
facade.
'''

# --------------------------------------------------------------------------
# scope

[scope.facade]
omit-imports = ["core"]
reason = '''
gcc 16.1.0 ICEs (segmentation fault at the export-module line) when the scope
GMF (unique_fd.hpp, whose entities depend on core) is combined with re-exporting
mcpplibs.mwrap.boost.core; clang has no such issue (see src/scope.cppm).
Consumers import mcpplibs.mwrap.boost.core on their own.
'''

# --------------------------------------------------------------------------
# signals2

[[signals2.guard]]
if = "defined(BOOST_HAS_WINTHREADS)"
reason = '''
The critical-section mutex is the Windows-threads branch of signals2's
lightweight mutex; POSIX uses pthread.
'''
names = [  # any :: segment
    "critical_section",
    "critical_section_debug",
    "rtl_critical_section",
]

# --------------------------------------------------------------------------
# sort

[sort.facade]
omit-imports = ["range"]
reason = '''
range exports `using boost::sort;` (boost::range::sort injected into boost),
which collides with namespace boost::sort: re-exporting range makes every
`boost::sort::...` in sort.inc ambiguous. The body references to range stay a
.deps edge only.
'''


# export_policy.toml — what the AST cannot decide about the module surface.
#
# tools/gen_exports.py computes every export list from clang's AST of the
# library's bundle TU. This file holds the remaining human decisions, each
# with a written reason, and the generator applies them while writing
# generated/exports/*.inc. Nothing edits the generated files afterwards; every
# name touched here is listed in generated/meta/skipped.txt.
#
#   [<lib>]
#   gmf               = exact GMF/bundle include set (paths below upstream/boost)
#   defines           = extra -D macros of the bundle (must match the .cppm GMF)
#   inline-namespaces = inline namespaces whose members are exported through
#                       the enclosing namespace (macro-selected inline names)
#   add               = names no collector reaches that consumers need
#
#   [[<lib>.guard]]   if = "<preprocessor condition>", names = [...],
#                     reason = "...", else = ["<line>", ...] (optional)
#   [[<lib>.drop]]    names = [...], reason = "..."
#   [[<lib>.extra]]   namespace = "boost", lines = [...], reason = "..."
#                     (namespace = "" exports into the global namespace)
#   [<lib>.deps]      add = [...], remove = [...], reason = "..."
#
# A `names` entry with `::` matches one qualified name exactly; a bare
# identifier matches any `::` segment of an exported name.
#
# Guards exist because the snapshot is one platform flavor (MinGW x86_64,
# libstdc++): a declaration that only that flavor's preprocessor branch
# declares is exported under the upstream header's own condition, so other
# platforms compile the same list.

[json]
# The compiled definitions live in libs/json/src/src.cpp; the module GMF must
# not include src.hpp (it pulls the .ipp implementation declarations).
gmf = ["boost/json/debug_printers.hpp", "boost/json.hpp"]

[outcome]
# The experimental/status-code subtree (marked EXPERIMENTAL upstream)
# redeclares Win32 APIs (FormatMessageW, ...) in extern "C" and conflicts with
# the MinGW SDK once the whole outcome header set lands in one TU. The module
# keeps the supported surface; the experimental headers stay include-only.
gmf = [
    "boost/outcome.hpp",
    "boost/outcome/bad_access.hpp",
    "boost/outcome/basic_outcome.hpp",
    "boost/outcome/basic_result.hpp",
    "boost/outcome/boost_outcome.hpp",
    "boost/outcome/boost_result.hpp",
    "boost/outcome/config.hpp",
    "boost/outcome/convert.hpp",
    "boost/outcome/coroutine_support.hpp",
    "boost/outcome/iostream_support.hpp",
    "boost/outcome/iostream_support_result.hpp",
    "boost/outcome/outcome.hpp",
    "boost/outcome/result.hpp",
    "boost/outcome/std_outcome.hpp",
    "boost/outcome/std_result.hpp",
    "boost/outcome/success_failure.hpp",
    "boost/outcome/trait.hpp",
    "boost/outcome/try.hpp",
    "boost/outcome/utils.hpp",
]

[stacktrace]
# src/stacktrace.cppm defines BOOST_STACKTRACE_LINK in its GMF (link mode, the
# implementation is libs/stacktrace/src/basic.cpp); the export list must be
# computed under the same macro.
defines = ["BOOST_STACKTRACE_LINK"]

[any]
# boost::any::type() returns const boost::typeindex::type_info&, and
# any_cast's template body compares type_info against type_index. Neither the
# signature closure nor ownership reaches the typeindex surface, and
# boost.variant claims the operators first; any_cast is instantiated in
# consumer TUs, so the names must be reachable from boost.any itself (legal
# duplicate re-export). RTTI flavor only: ctti_* exists solely under
# BOOST_NO_RTTI, which the build does not define.
add = [
    "boost::typeindex::type_index",
    "boost::typeindex::type_info",
    "boost::typeindex::type_id",
    "boost::typeindex::type_id_with_cvr",
    "boost::typeindex::type_id_runtime",
    "boost::typeindex::stl_type_index",
    "boost::typeindex::type_index_facade",
    "boost::typeindex::operator==",
    "boost::typeindex::operator!=",
    "boost::typeindex::operator<",
    "boost::typeindex::operator>",
    "boost::typeindex::operator<=",
    "boost::typeindex::operator>=",
]

[filesystem]
# directory_iterator / recursive_directory_iterator derive from
# boost::iterators::iterator_facade, whose comparison operators are friend
# function templates of iterator_core_access. Declared in the GMF they are not
# visible to ADL from consumer TUs (`it != end` fails), so the module
# re-exports the names; the random-access set is included for other
# iterator_facade consumers.
add = [
    "boost::iterators::operator==",
    "boost::iterators::operator!=",
    "boost::iterators::operator<",
    "boost::iterators::operator>",
    "boost::iterators::operator<=",
    "boost::iterators::operator>=",
    "boost::iterators::operator+",
    "boost::iterators::operator-",
    "boost::iterators::operator++",
]

[algorithm]
# gcc 16.1.0 rejects the boost::regex v5 abi-tag surface inside a module
# interface ("mismatching abi tags for get_catalog_name_inst") although the same
# headers compile standalone, so the module GMF takes the boost/algorithm/
# string.hpp aggregate instead of string_regex.hpp and the *_regex family stays
# include-only (clang would accept the full surface).
gmf = [
    "boost/algorithm/algorithm.hpp",
    "boost/algorithm/apply_permutation.hpp",
    "boost/algorithm/clamp.hpp",
    "boost/algorithm/cxx11/all_of.hpp",
    "boost/algorithm/cxx11/any_of.hpp",
    "boost/algorithm/cxx11/copy_if.hpp",
    "boost/algorithm/cxx11/copy_n.hpp",
    "boost/algorithm/cxx11/find_if_not.hpp",
    "boost/algorithm/cxx11/iota.hpp",
    "boost/algorithm/cxx11/is_partitioned.hpp",
    "boost/algorithm/cxx11/is_sorted.hpp",
    "boost/algorithm/cxx11/one_of.hpp",
    "boost/algorithm/cxx11/partition_copy.hpp",
    "boost/algorithm/cxx11/partition_point.hpp",
    "boost/algorithm/cxx14/equal.hpp",
    "boost/algorithm/cxx14/is_permutation.hpp",
    "boost/algorithm/cxx17/exclusive_scan.hpp",
    "boost/algorithm/cxx17/for_each_n.hpp",
    "boost/algorithm/cxx17/inclusive_scan.hpp",
    "boost/algorithm/cxx17/reduce.hpp",
    "boost/algorithm/cxx17/transform_exclusive_scan.hpp",
    "boost/algorithm/cxx17/transform_inclusive_scan.hpp",
    "boost/algorithm/cxx17/transform_reduce.hpp",
    "boost/algorithm/find_backward.hpp",
    "boost/algorithm/find_not.hpp",
    "boost/algorithm/gather.hpp",
    "boost/algorithm/hex.hpp",
    "boost/algorithm/is_clamped.hpp",
    "boost/algorithm/is_palindrome.hpp",
    "boost/algorithm/is_partitioned_until.hpp",
    "boost/algorithm/minmax.hpp",
    "boost/algorithm/minmax_element.hpp",
    "boost/algorithm/searching/boyer_moore.hpp",
    "boost/algorithm/searching/boyer_moore_horspool.hpp",
    "boost/algorithm/searching/knuth_morris_pratt.hpp",
    "boost/algorithm/sort_subrange.hpp",
    "boost/algorithm/string.hpp",
    "boost/algorithm/string/trim_all.hpp",
]

[[container.extra]]
namespace = ""
reason = '''
allocator_traits::construct places elements with the global
operator new(std::size_t, void*, boost_container_new_t) of
boost/container/detail/placement_new.hpp. A consumer TU that instantiates it
(pmr::vector<json::value>::resize, in the json documentation) looks the
operator up at the point of instantiation, where only exported declarations
are visible; the generator exports boost:: names only, so the tag type and
its placement operators are exported here. gcc only: on clang the
using-declarations re-export every global operator new, and libc++'s own
aligned allocations in another module's instantiations become ambiguous
(`call to 'operator new' is ambiguous`, tests/statechart.cpp); clang reaches the
operator through src/json.cppm instead.
'''
lines = [
    "using ::boost_container_new_t;",
    "#if defined(__GNUC__) && !defined(__clang__)",
    "using ::operator new;",
    "using ::operator delete;",
    "#endif",
]

[convert]
# The converter headers are not self-contained (they use uint8_t without
# <cstdint> and boost::optional without its header, relying on
# <boost/convert.hpp> coming first, as in every upstream example), so the
# standalone-compile filter dropped them and the module exported convert()
# with no converter. convert.hpp leads the GMF. boost/convert/spirit.hpp is
# left out: it pulls Boost.Spirit, a header-only library no module owns, whose
# whole qi surface would become convert's exports; the spirit converter is
# consumed as headers (tests/convert/include_spirit.cpp).
gmf = [
    "boost/convert.hpp",
    "boost/convert/charconv.hpp",
    "boost/convert/lexical_cast.hpp",
    "boost/convert/printf.hpp",
    "boost/convert/stream.hpp",
    "boost/convert/strtol.hpp",
]

[cobalt]
# POSIX cobalt selects the epoll reactor; asio's reactor/hash_map details are
# reached only through Windows-flavored chains in the MinGW snapshot. The
# facade includes them so the shared-surface using-declarations resolve on
# every platform (they are not part of the export computation).
facade-includes = [
    "boost/asio/detail/fd_set_adapter.hpp",
    "boost/asio/detail/hash_map.hpp",
    "boost/asio/detail/null_reactor.hpp",
    "boost/asio/detail/reactor_op_queue.hpp",
    "boost/asio/detail/select_reactor.hpp",
    "boost/asio/detail/socket_select_interrupter.hpp",
]

[nowide]
# cstdio/stackstring/convert are reached only via Windows-flavored transitive
# includes in the MinGW snapshot; the facade includes the cross-platform
# headers explicitly so the shared-surface using-declarations resolve.
facade-includes = [
    "boost/nowide/convert.hpp",
    "boost/nowide/cstdio.hpp",
    "boost/nowide/stackstring.hpp",
]

[parser]
# boost/parser/detail/numeric.hpp selects the inline namespace by macro
# (std_charconv / boost_charconv / spirit_parsers, depending on <charconv>
# support); exporting through the enclosing namespace names the same
# entities on every platform.
inline-namespaces = ["boost::parser::detail::numeric::std_charconv"]

[[align.drop]]
names = ["std::alignment_of"]
reason = """
boost::alignment::detail::alignment_of is `using std::alignment_of` only on
some compilers; other targets (clang outside x86_64) define a template of that
name, which the std re-export would conflict with.
"""

[[utility.drop]]
names = [
    "boost::basic_string_ref",
    "boost::string_ref",
    "boost::u16string_ref",
    "boost::u32string_ref",
    "boost::wstring_ref",
]
reason = """
Declared only via boost/utility/string_ref.hpp, which is left out of the
module GMF (gcc 16.1 buffer_fill enum mismatch); consumers include the header.
"""

[[multiprecision.drop]]
names = [
    "boost::multiprecision::detail::unmentionable",
    "boost::multiprecision::detail::unmentionable_type",
]
reason = """
Detail placeholder (a member-pointer typedef used to disable overloads); gcc
treats it as having no external linkage and refuses the export.
"""

[[winapi.drop]]
names = [
    "boost::winapi::detail::winsdk_condition_variable",
    "boost::winapi::detail::winsdk_critical_section",
    "boost::winapi::detail::winsdk_srwlock",
]
reason = """
Declared inside extern "C" blocks, and only without windows.h and above a
Windows API version (BOOST_USE_WINAPI_VERSION); the definition differs between
MinGW and the Windows SDK. Implementation detail of boost.winapi's own
signatures, not a name consumers spell.
"""

[[flyweight.drop]]
namespaces = ["boost::detail", "boost::mpl", "boost::parameter"]
reason = """
The bundle pulls the transitive container/interprocess/parameter surface into
shared namespaces; boost.flyweight exports its own namespaces and boost::
entry points only.
"""

[[type_erasure.guard]]
if = "defined(__GNUC__)"
reason = """
boost::mpl::item_by_order_impl is declared by the gcc-preprocessed mpl map
headers only (absent from the msvc-flavor preprocessing); type_erasure claims
it when it is processed before poly_collection.
"""
names = ["boost::mpl::item_by_order_impl"]

[version.deps]
# Hand-written module (src/version.cppm): the thin entry re-exports the macro
# mapping module, where the constants live (one export owner).
add = ["macros"]

# --------------------------------------------------------------------------
# asio

[[asio.extra]]
namespace = "boost::asio::stream_errc"
reason = '''
boost/asio/error.hpp simulates the proposed stream_errc / socket_errc scoped
enums with namespaces that hold only using-declarations of error::
enumerators (the cpp14 blocking_tcp_echo_server example compares with
boost::asio::stream_errc::eof). The generator collects declared entities, not
using-declarations, so those namespaces are re-created here.
'''
lines = [
    "using boost::asio::error::eof;",
    "using boost::asio::error::not_found;",
]

[[asio.extra]]
namespace = "boost::asio::socket_errc"
reason = "Like boost::asio::stream_errc: boost/asio/error.hpp simulates the proposed socket_errc scoped enum with a namespace of using-declarations of error:: enumerators, re-created here."
lines = [
    "using boost::asio::error::already_open;",
    "using boost::asio::error::not_found;",
]


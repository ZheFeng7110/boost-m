[[beast.guard]]
if = "defined(_WIN32)"
reason = '''
Beast's Win32 file and debug-stream helpers (file_win32.hpp, detail/ostream
dstream) are Windows-only.
'''
names = [  # any :: segment
    "file_win32",
    "set_file_pointer_ex",
    "win32_unicode_path",
    "highPart",
    "lowPart",
    "make_win32_error",
    "null_lambda",
    "run_write_some_win32_op",
    "write_some_win32_op",
    "basic_dstream",
    "dstream_buf",
]

[[beast.extra]]
namespace = "boost::beast"
reason = '''
boost/beast/core/error.hpp declares `namespace errc = boost::system::errc;`
(the examples write beast::errc::not_connected). The generator collects
entities, and a using-declaration cannot name a namespace alias, so the alias
is re-declared here (a redeclaration denoting the same namespace).
'''
lines = [
    "namespace errc = ::boost::system::errc;",
]


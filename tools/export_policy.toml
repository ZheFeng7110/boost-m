[[thread.extra]]
namespace = "boost"
reason = '''
M7c: gcc 16.1.0 module consumers emit a partial vtable for clone_impl<T>
(virtual base clone_base) whose thunk slots stay undefined — gcc never emits
the thunks in a module consumer TU. These extern-template declarations
suppress the consumer's implicit instantiation; the complete vtable + thunks
come from the explicit instantiation in port/thread_extras.cpp (same pattern
as boost_system_extras.cpp).
'''
lines = [
    "extern template class boost::exception_detail::clone_impl<boost::broken_promise>;",
    "extern template class boost::exception_detail::clone_impl<boost::unknown_exception>;",
    "extern template class boost::exception_detail::clone_impl<boost::exception_detail::std_exception_ptr_wrapper>;",
]

# --------------------------------------------------------------------------
# tuple

[[tuple.guard]]
if = "!defined(__GNUC__)"
reason = '''
M3 hand-guard: ignore_t is a member-pointer typedef; gcc treats it as
internal linkage.
'''
names = [
    "boost::tuples::detail::ignore_t",
]

# --------------------------------------------------------------------------
# url

[[url.guard]]
if = "defined(BOOST_URL_USE_SSE2)"
reason = '''
M7 platform guard: charset.hpp defines the *_pred SSE2 helpers only under
BOOST_URL_USE_SSE2 (x86 with SSE2); absent on arm64 (e.g. macOS).
'''
names = [
    "boost::urls::grammar::detail::find_if_not_pred",
    "boost::urls::grammar::detail::find_if_pred",
]

# --------------------------------------------------------------------------
# uuid

[[uuid.guard]]
if = "defined(BOOST_UUID_USE_SSE2)"
reason = '''
The SIMD to_chars/from_chars helpers are declared only under
BOOST_UUID_USE_SSE2 (x86); arm64 takes the scalar path.
'''
names = [  # any :: segment
    "compare",
    "countr_zero_nz",
    "from_chars_simd",
    "from_chars_simd_char_constants",
    "from_chars_simd_constants",
    "from_chars_simd_core",
    "from_chars_simd_load_traits",
    "simd_vector",
    "simd_vector128",
    "simd_vector256",
    "simd_vector512",
    "to_chars_simd",
    "to_chars_simd_char_constants",
    "to_chars_simd_constants",
    "to_chars_simd_core",
]


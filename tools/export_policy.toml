# leaf

[[leaf.extra]]
namespace = "boost::leaf::detail"
reason = '''
M9: gcc 16.1.0 module consumers emit a partial vtable for
exception<bad_result> (multi-base exception_base/error_id) whose non-virtual
thunks stay undefined — gcc never emits them in a module consumer TU. This
extern template suppresses the consumer's implicit instantiation; the
complete vtable + thunks come from the explicit instantiation in
port/leaf_extras.cpp (same pattern as thread's clone_impl, cf. M7c).
'''
lines = [
    "extern template class boost::leaf::detail::exception<boost::leaf::bad_result>;",
]


# --------------------------------------------------------------------------
# container

[[container.guard]]
if = "defined(_WIN32)"
reason = '''
M11 platform guard: win_critical_section is the non-pthread branch of
container/detail/thread_mutex.hpp; POSIX uses pthread_mutex.
'''
names = [
    "boost::container::dtl::win_critical_section",
]

[[container.guard]]
if = "defined(_WIN32)"
reason = '''
M11 platform guard: container_winapi DWORD_/BOOL_/SleepEx are declared only
in the _WIN32 branch of container/detail/mutex.hpp.
'''
names = [
    "::SleepEx",
    "boost::container_winapi::BOOL_",
    "boost::container_winapi::DWORD_",
]

# --------------------------------------------------------------------------
# core

[[core.guard]]
if = "defined(__GNUC__)"
reason = '''
M3 hand-guard: boost/core/cmath.hpp defines copysign_impl only on gcc-like
compilers.
'''
names = [
    "boost::core::detail::copysign_impl",
]

[[core.guard]]
if = "defined(_WIN32) || defined(__WIN32__) || defined(__CYGWIN__)"
reason = '''
M6 platform guard: sp_thread_sleep/yield live in boost::core::detail only on
Windows; on POSIX (nanosleep/sched_yield branch of the header) they are
declared in boost::core.
'''
names = [
    "boost::core::detail::sp_thread_sleep",
    "boost::core::detail::sp_thread_yield",
]
else = [
    "using boost::core::sp_thread_sleep;",
    "using boost::core::sp_thread_yield;",
]


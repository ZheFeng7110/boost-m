# --------------------------------------------------------------------------
# atomic

[[atomic.guard]]
if = "defined(__GNUC__)"
reason = '''
M11 platform guard: gcc-only branch of boost/atomic (snapshot = mingw
flavor).
'''
names = [
    "boost::atomics::detail::convert_memory_order_to_gcc",
    "boost::atomics::detail::core_operations_gcc_atomic",
    "boost::atomics::detail::fence_operations_gcc_atomic",
]

[[atomic.guard]]
if = "defined(__GNUC__) && (defined(__i386__) || defined(__x86_64__))"
reason = '''
M11 platform guard: gcc_x86 backend of boost/atomic (platform.hpp); x86
only.
'''
names = [
    "boost::atomics::detail::core_arch_operations_gcc_x86",
    "boost::atomics::detail::core_arch_operations_gcc_x86_base",
    "boost::atomics::detail::fence_arch_operations_gcc_x86",
]

[[atomic.guard]]
if = "defined(BOOST_WINDOWS)"
reason = '''
M11 platform guard: wait_ops_windows.hpp (wait backend = windows,
platform.hpp BOOST_WINDOWS); POSIX uses futex/darwin_ulock/generic.
'''
names = [
    "boost::atomics::detail::wait_operations_windows",
]


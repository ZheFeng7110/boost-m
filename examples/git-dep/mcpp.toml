# Example consumer of the Boost module wrapper — git dependency flavor.
#
# Same code shape as examples/basic/, but the dependency is declared the way an
# external project would consume it: from the repository at the immutable
# `mwrap-` release tag, with default-features = false and an explicit feature
# list (docs/usage.md §1).
#
#   mcpp run          build + run
#   mcpp build        just build
#
# Features picked for the demo:
#   optional        — header-only classic (import mcpplibs.mwrap.boost.optional;)
#   json            — compiled library (import mcpplibs.mwrap.boost.json;)
#   version         — the mapped version constants (import ...boost.version;)
#   type-traits     — pulled implicitly by optional; listed to show the spelling
[package]
name        = "boost-example-git-dep"
version     = "0.1.0"
description = "Example consumer: git dep, default-features = false, explicit features"
license     = "Apache-2.0"

[dependencies]
"mcpplibs.mwrap.boost" = { git = "https://github.com/mcpplibs/boost-m", tag = "mwrap-1.92.0", default-features = false, features = ["optional", "json", "version", "type-traits"] }

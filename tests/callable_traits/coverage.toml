case = "callable_traits/examples:example: add_noexcept"

[[example]]
path   = "libs/callable_traits/example/add_transaction_safe.cpp"
status = "excluded"
reason = "transaction_safe function types need GCC's -fgnu-tm (Transactional Memory TS); without it upstream compiles this example to an empty main"


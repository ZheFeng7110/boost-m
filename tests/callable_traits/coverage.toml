# tests/callable_traits/coverage.toml — official examples and documentation snippets of
# Boost.callable_traits 1.92.0 mapped to test cases (tools/ci/test_coverage.py; design
# .agents/docs/2026-11-09-module-test-hardening-design.md §4.6).
# `scan` adds and drops entries; status, case and reason are maintained by hand.
upstream = "1.92.0"
library = "callable_traits"

[[example]]
path = "libs/callable_traits/example/add_member_const.cpp"
case = "callable_traits/examples:example: add_member_const"

[[example]]
path = "libs/callable_traits/example/add_member_cv.cpp"
case = "callable_traits/examples:example: add_member_cv"

[[example]]

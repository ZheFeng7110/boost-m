# tests/describe/coverage.toml — official examples and documentation snippets of
# Boost.describe 1.92.0 mapped to test cases (tools/ci/test_coverage.py; design
# .agents/docs/2026-11-09-module-test-hardening-design.md §4.6).
# `scan` adds and drops entries; status, case and reason are maintained by hand.
upstream = "1.92.0"
library = "describe"

[[example]]
path = "libs/describe/example/console.cpp"
case = "describe/examples_json:example: console"

[[example]]
path = "libs/describe/example/enum_to_string.cpp"
case = "describe/include_examples:example: enum_to_string"

[[example]]
path = "libs/describe/example/equality.cpp"
case = "describe/include_examples:example: equality"

[[example]]
path   = "libs/describe/example/fmtlib_class_formatter.cpp"
status = "excluded"
reason = "needs the {fmt} library, which the package does not vendor"

[[example]]
path   = "libs/describe/example/fmtlib_enum_formatter.cpp"
status = "excluded"
reason = "needs the {fmt} library, which the package does not vendor"

[[example]]

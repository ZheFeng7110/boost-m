# tests/dll/coverage.toml — official examples and documentation snippets of
# Boost.dll 1.92.0 mapped to test cases (tools/ci/test_coverage.py; design
# .agents/docs/2026-11-09-module-test-hardening-design.md §4.6).
# `scan` adds and drops entries; status, case and reason are maintained by hand.
upstream = "1.92.0"
library = "dll"

[[example]]
path = "libs/dll/example/getting_started.cpp"
case = "dll/examples:example: getting_started"

[[example]]
path = "libs/dll/example/getting_started_library.cpp"
case = "dll/examples:example: getting_started_library"

[[example]]
path   = "libs/dll/example/mangled/import_class.cpp"
status = "excluded"
reason = "does not compile as published (`\"Calc(float): \" (cl->*calc)` lacks its <<) and needs the mangled test plugin of libs/dll/test; smart_library / import_class are experimental"

[[example]]
path   = "libs/dll/example/mangled/smart_lib.cpp"
status = "excluded"
reason = "does not compile as published (unqualified cout / endl) and needs the mangled test plugin of libs/dll/test; smart_library is experimental"


# A plugin of the dll tests: tutorial6/on_unload_lib.cpp of the Boost.DLL examples, unchanged
# except for its include of the shared plugin API (tests/dll/common/).
[package]
name    = "on_unload_lib"
version = "0.0.0"

[dependencies]
"mcpplibs.mwrap.boost" = { path = "../../../..", default-features = false, features = ["dll"] }

[targets.on_unload_lib]
kind = "shared"

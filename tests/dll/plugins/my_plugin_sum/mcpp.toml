# A plugin of the dll tests: tutorial1/my_plugin_sum.cpp of the Boost.DLL examples, unchanged
# except for its include of the shared plugin API (tests/dll/common/).
[package]
name    = "my_plugin_sum"
version = "0.0.0"

[dependencies]
"mcpplibs.mwrap.boost" = { path = "../../../..", default-features = false, features = ["dll"] }

[targets.my_plugin_sum]
kind = "shared"

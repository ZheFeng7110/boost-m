# A plugin of the dll tests: tutorial7/library1.cpp of the Boost.DLL examples, unchanged
# except for its include of the shared plugin API (tests/dll/common/).
[package]
name    = "library1"
version = "0.0.0"

[dependencies]
"mcpplibs.mwrap.boost" = { path = "../../../..", default-features = false, features = ["dll"] }

[targets.library1]
kind = "shared"

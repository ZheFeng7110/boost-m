# A plugin of the dll tests: tutorial2/my_plugin_aggregator.cpp of the Boost.DLL examples, unchanged
# except for its include of the shared plugin API (tests/dll/common/).
[package]
name    = "my_plugin_aggregator"
version = "0.0.0"

[dependencies]
"mcpplibs.mwrap.boost" = { path = "../../../..", default-features = false, features = ["dll"] }

[targets.my_plugin_aggregator]
kind = "shared"

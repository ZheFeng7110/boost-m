[[snippet]]
doc   = "libs/variant2/doc/variant2/overview.adoc#usage-examples"
title = "Usage Examples"
case  = "variant2/examples:doc: usage-examples"

[[snippet]]
doc   = "libs/variant2/doc/variant2/overview.adoc#visitation"

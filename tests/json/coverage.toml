# tests/json/coverage.toml — official examples and documentation snippets of
# Boost.json 1.92.0 mapped to test cases (tools/ci/test_coverage.py; design
# .agents/docs/2026-11-09-module-test-hardening-design.md §4.6).
# `scan` adds and drops entries; status, case and reason are maintained by hand.
upstream = "1.92.0"
library = "json"

[[example]]
path = "libs/json/example/cbor.cpp"
case = "json/examples:example: cbor"

[[example]]
path   = "libs/json/example/parse_into.cpp"

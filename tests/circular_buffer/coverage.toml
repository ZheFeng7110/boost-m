[[example]]
path = "libs/circular_buffer/example/circular_buffer_iter_example.cpp"
case = "circular_buffer/examples:example: circular_buffer_iter_example"

[[example]]
path = "libs/circular_buffer/example/circular_buffer_sum_example.cpp"
case = "circular_buffer/examples:example: circular_buffer_sum_example"

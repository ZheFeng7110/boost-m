# tests/cobalt/coverage.toml — official examples and documentation snippets of
# Boost.cobalt 1.92.0 mapped to test cases (tools/ci/test_coverage.py; design
# .agents/docs/2026-11-09-module-test-hardening-design.md §4.6).
# `scan` adds and drops entries; status, case and reason are maintained by hand.
upstream = "1.92.0"
library = "cobalt"

[[example]]
path = "libs/cobalt/example/channel.cpp"
case = "cobalt/examples:example: channel"

[[example]]
path = "libs/cobalt/example/delay.cpp"
case = "cobalt/examples:example: delay"

[[example]]
path = "libs/cobalt/example/delay_op.cpp"
case = "cobalt/examples:example: delay_op"

[[example]]
path = "libs/cobalt/example/echo_server.cpp"
case = "cobalt/examples:example: echo_server"

[[example]]
path   = "libs/cobalt/example/http.cpp"
status = "excluded"
reason = "needs OpenSSL (the package builds asio without SSL; boost/asio/ssl is not in the module) and talks to a public internet service"

[[example]]
path = "libs/cobalt/example/outcome.cpp"
case = "cobalt/examples:example: outcome"

[[example]]
path   = "libs/cobalt/example/python.cpp"
status = "excluded"
reason = "a CPython extension module (needs Python.h and the interpreter)"

[[example]]
path = "libs/cobalt/example/signals.cpp"
case = "cobalt/examples:example: signals"

[[example]]
path   = "libs/cobalt/example/spsc.cpp"
status = "excluded"
reason = "its awaitable_spsc_queue races: await_suspend stores write_executor / the handle without synchronising with the other thread's check and post (a lost wake-up hangs; on aarch64 the unsynchronised executor read crashed)"

[[example]]
path = "libs/cobalt/example/thread.cpp"
case = "cobalt/examples:example: thread"

[[example]]
path = "libs/cobalt/example/thread_pool.cpp"
case = "cobalt/examples:example: thread_pool"

[[example]]
path   = "libs/cobalt/example/ticker.cpp"
status = "excluded"
reason = "needs OpenSSL (the package builds asio without SSL; boost/asio/ssl is not in the module) and talks to a public internet service"


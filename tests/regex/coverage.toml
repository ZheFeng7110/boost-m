# tests/regex/coverage.toml — official examples and documentation snippets of
# Boost.regex 1.92.0 mapped to test cases (tools/ci/test_coverage.py; design
# .agents/docs/2026-11-09-module-test-hardening-design.md §4.6).
# `scan` adds and drops entries; status, case and reason are maintained by hand.
upstream = "1.92.0"
library = "regex"

[[example]]
path = "libs/regex/example/grep/grep.cpp"
case = "regex/examples_grep:example: grep"

[[example]]
path   = "libs/regex/example/snippets/captures_example.cpp"
status = "excluded"
reason = "needs a regex library built with BOOST_REGEX_MATCH_EXTRA (a configuration that changes the compiled TUs); the package builds the default configuration"

[[example]]
path = "libs/regex/example/snippets/credit_card_example.cpp"
case = "regex/examples:example: credit_card_example"

[[example]]

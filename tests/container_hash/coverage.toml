# tests/container_hash/coverage.toml — official examples and documentation snippets of
# Boost.container_hash 1.92.0 mapped to test cases (tools/ci/test_coverage.py; design
# .agents/docs/2026-11-09-module-test-hardening-design.md §4.6).
# `scan` adds and drops entries; status, case and reason are maintained by hand.
upstream = "1.92.0"
library = "container_hash"

[[example]]
path = "libs/container_hash/examples/books.cpp"
case = "container_hash/examples:example: books"

[[example]]
path = "libs/container_hash/examples/point.cpp"
case = "container_hash/examples:example: point"

[[example]]
path = "libs/container_hash/examples/point2.cpp"
case = "container_hash/include_describe:example: point2"

[[example]]
path = "libs/container_hash/examples/portable.cpp"
case = "container_hash/examples:example: portable"

[[example]]
path = "libs/container_hash/examples/template.cpp"
case = "container_hash/examples:example: template"

[[snippet]]
doc   = "libs/container_hash/doc/hash/notes.adoc#hash-combine"
title = "hash_combine"
case  = "container_hash/examples:doc: hash-combine"

[[snippet]]
doc   = "libs/container_hash/doc/hash/notes.adoc#hash-range"
title = "hash_range"
case  = "container_hash/examples:doc: hash-range"

# -- </gen-sources> --
include_dirs = [
    "port/include",
    "upstream/boost",
    # Library TUs that include private headers next to themselves (upstream
    # target_include_directories(... PRIVATE src)); consumers never see these.
    "upstream/boost/libs/log/src",
    "upstream/boost/libs/atomic/src",
]
private_include_dirs = [
    "upstream/boost/libs/log/src",
    "upstream/boost/libs/atomic/src",
]
# The module TUs and the library TUs must see the same ABI-relevant macros: a
# macro that changes layout or declaration must never be defined by a consumer
# only, because it cannot change what is already frozen in the BMI.
#   BOOST_ALL_NO_LIB      no MSVC autolink pragmas
#   BOOST_FILESYSTEM_VERSION=3 / BOOST_THREAD_VERSION=2 are the upstream
#                         defaults the exports were generated against; pin them
#                         so an environment that defines them differently
#                         cannot desynchronize the interface from the TUs.
#   _MT                   clang-cl flavor does not define the thread flag; Boost
#                         config keys BOOST_HAS_THREADS on it
#   WIN32_LEAN_AND_MEAN   asio pulls winsock2 itself; windows.h must not pull
#                         winsock1 first
#   SECURITY_WIN32        log's windows TUs include <security.h> (upstream
#                         CMakeLists.txt:324 defines it for those TUs only)
defines  = ["BOOST_ALL_NO_LIB", "_MT", "WIN32_LEAN_AND_MEAN", "SECURITY_WIN32",
            "BOOST_FILESYSTEM_VERSION=3", "BOOST_THREAD_VERSION=2"]
# Vendored headers emit warning noise by design; keep it out of consumer logs.
cxxflags = ["-w"]
# thread's win32 TUs need BOOST_THREAD_BUILD_LIB; per-glob so it stays on the
# library TU and never reaches a consumer (see docs/architecture.md §ABI).
flags = [{ glob = "upstream/boost/libs/thread/src/**", defines = ["BOOST_THREAD_BUILD_LIB"] }]

# poly_collection's detail headers specialize std::is_void; clang+MSVC STL
# hard-errors on that for plain #include consumers too.
[target.'cfg(compiler = "llvm")'.build]
cxxflags = ["-Wno-invalid-specialization"]


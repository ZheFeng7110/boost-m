# boost-m — Boost 1.92.0 as C++23 named modules (mcpplibs.mwrap.boost).
#
#   upstream/boost/            pinned official Boost 1.92.0 tree (pruned), read-only
#   patches/                   Boost / platform adaptations, replayed by tools/
#   port/                      wrapper-side TUs, include entry and config
#   src/<lib>.cppm             module interfaces (GMF include -> export module -> export using)
#   src/boost.cppm             interface root; build.mcpp adds the closure partition
#   generated/exports/*.inc    committed export using-lists (tools/gen_exports.py)
#   generated/meta/            committed generator output (libs.json, *.lst)
#   tests/**/*.cpp             per-library API/behavior tests (mcpp test)
#
# The API spelling is upstream's: consumers import `mcpplibs.mwrap.boost.<lib>`
# and keep writing `boost::optional`, `boost::filesystem`, ... A named module
# cannot export macros; `mcpplibs.mwrap.boost.macros` maps the object-like
# constants and <mwrap/boost/macros.hpp> is the include entry for the rest.
#
# [features] and [build].sources are generated by tools/gen_features.py between
# the markers below — do not edit them by hand. `mcpp build` compiles only the
# sources of the active features; `mcpp test` also compiles the base list.
#
# See docs/architecture.md (design), docs/usage.md (consumer guide),
# .agents/docs/ (history of the pre-mwrap wrapper).

[package]
namespace   = "mcpplibs.mwrap"
name        = "boost"
version     = "1.92.0"
description = "Boost 1.92.0 C++23 named module wrapper — import mcpplibs.mwrap.boost.optional; API spelling unchanged"
license     = "Apache-2.0"
authors     = ["mcpp-community"]
repo        = "https://github.com/mcpplibs/boost-m"
platforms   = ["linux", "macos", "windows"]

[package.metadata.mwrap]
upstream-version = "1.92.0"
wrapper-revision = 0

[build]

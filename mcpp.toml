# Per-OS TU exclusion: the feature sources glob both platform directories and
# the target table removes the other one (same symbol names in log's
# windows/posix object_name.cpp and ipc_reliable_message_queue.cpp).
[target.windows.build]
defines = ["_WIN32_WINNT=0x0A00"]
sources = [
    "!upstream/boost/libs/thread/src/pthread/**",
    "!upstream/boost/libs/log/src/posix/**",
]
# System libraries the Windows TUs need, mirroring upstream's WIN32 link set
# (cobalt/process sockets and process info, log's object_name, atomic's
# WaitOnAddress).
ldflags = ["-lws2_32", "-lntdll", "-lshell32", "-ladvapi32", "-lsecur32", "-luser32", "-lsynchronization"]

[target.unix.build]
sources = [
    "!upstream/boost/libs/thread/src/win32/**",
    "!upstream/boost/libs/log/src/windows/**",
]
ldflags = ["-pthread"]

# LLVM 22.1.8's lld-macho can emit a duplicate zero-unwind entry when a
# zero-length __TEXT,__text input precedes a throwing function; libunwind then
# reports end-of-stack during phase one. Use Apple's linker on macOS
# (llvm/llvm-project#216154).
[target.macos.build]
ldflags = ["-fuse-ld=/usr/bin/ld"]

# Notices a consumer bundle carries. The three sources are different licences
# with the same basenames (wrapper Apache-2.0, Boost BSL, legacy wrapper BSL),
# so each lands in its own directory instead of overwriting another.
[[runtime.deploy]]
from = "LICENSE"
to = "licenses/boost/wrapper"

[[runtime.deploy]]
from = "NOTICE"
to = "licenses/boost/wrapper"

[[runtime.deploy]]
from = "upstream/boost/README.md"
to = "licenses/boost/upstream/boost"

[[runtime.deploy]]
from = "upstream/boost/LICENSE_1_0.txt"
to = "licenses/boost/upstream/boost"

[[runtime.deploy]]
from = "upstream/boost-module/LICENSE"
to = "licenses/boost/upstream/boost-module"

[[runtime.deploy]]
from = "upstream/boost-module/README.md"
to = "licenses/boost/upstream/boost-module"

# The interface root is committed and feature-independent; build.mcpp writes the
# active closure partition into MCPP_OUT_DIR, so the package root stays read-only
# and two builds with different features cannot overwrite each other.
[lib]
path = "src/boost.cppm"

[targets.boost]
kind = "lib"
